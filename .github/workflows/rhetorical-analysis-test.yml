name: rhetorical-analysis tests

on:
  # Path filters only see the first 300 changed files of a push or PR, so a
  # very large change can skip this workflow; run it by hand then.
  workflow_dispatch:
  push:
    branches:
      - main
    paths: ["plugins/rhetorical-analysis/**", ".github/workflows/rhetorical-analysis-test.yml"]
  pull_request:
    branches:
      - main
    paths: ["plugins/rhetorical-analysis/**", ".github/workflows/rhetorical-analysis-test.yml"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: plugins/rhetorical-analysis

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Skill copies match the plugin root
        # references/ and assets/ exist at the plugin root and inside the
        # packaged skill; the two copies must stay byte-identical.
        run: |
          status=0
          for f in $(cd skills/rhetorical-analysis && find references assets -type f); do
            cmp "$f" "skills/rhetorical-analysis/$f" || status=1
          done
          exit $status

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short
