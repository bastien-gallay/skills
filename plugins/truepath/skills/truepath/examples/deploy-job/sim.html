<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Deploy job</title>
<style>
:root{--bg:#f6f7f9;--surface:#fff;--ink:#0f172a;--muted:#64748b;--line:#d5dbe3;--dim:#cbd5e1;--accent:#2563eb;--accent-soft:#dbe7fd;--hl:#fef3c7;
 --plus:#15803d;--minus:#b91c1c;--diverge:#b45309;
 --mono:ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace;--sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#0b1020;--surface:#121a2e;--ink:#e5e9f0;--muted:#8b97ab;--line:#26324a;--dim:#334155;--accent:#60a5fa;--accent-soft:#1e3a5f;--hl:#3b3416;--plus:#4ade80;--minus:#f87171;--diverge:#f59e0b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.5 var(--sans)}
header{padding:16px 20px 8px}
h1{font-size:22px;margin:0 0 4px;font-weight:650;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0;max-width:38em}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:8px 20px;border-bottom:1px solid var(--line)}
.grp{display:flex;gap:4px;flex-wrap:wrap}
button,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer}
button[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.sep{width:1px;height:22px;background:var(--line)}
main{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;padding:16px 20px}
main.overview{grid-template-columns:minmax(0,1fr) 34px}
main.overview #detail{display:none}
#detail{display:flex;flex-direction:column;gap:12px}
#fold{align-self:flex-end;color:var(--muted)}
main.overview #fold{writing-mode:vertical-rl;padding:12px 6px;align-self:stretch;max-height:220px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
svg{width:100%;height:auto;display:block;max-height:calc(100vh - 210px)}
.summary{margin:0 0 8px;font-size:16px;font-weight:500;min-width:0}
.summary>:not(.casehead),.casetext{max-width:38em}
.casehead{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:flex-start;justify-content:space-between}
.caserow{display:flex;gap:10px;align-items:flex-start}.caserow .home{font-size:13px;margin-top:8px}
body.grid .bar{display:none}
.ocap{display:none;margin:8px 0 0;font-size:16px}main.overview .ocap{display:block}
.ocap .cap2{display:inline;margin-right:16px}
.origin{display:block;font:11px var(--sans);font-weight:400;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.origin.real{color:var(--accent)}
.summary .warn{color:var(--diverge);font-weight:600}
aside{display:flex;flex-direction:column;gap:12px;position:sticky;top:8px;align-self:start;max-height:calc(100vh - 16px);overflow:auto}
.caption{font-size:16px;min-height:4.4em}
.msg{font-family:var(--mono);font-size:13px;color:var(--accent);margin-top:6px}
table{width:100%;border-collapse:collapse}
td{padding:4px 6px;border-bottom:1px solid var(--line);vertical-align:top}
td:first-child{color:var(--muted);width:46%}
td.v{font-family:var(--mono);overflow-wrap:anywhere} /* a long identifier wraps inside the panel, never past its edge */
.basis{font:11px var(--sans);margin-left:6px;cursor:help}.basisrow td{border-bottom:none;color:var(--muted);font-size:11px;padding-top:8px}.basisrow .basis{margin:0 10px 0 0;cursor:auto}.basis.code{color:var(--plus)}.basis.port{color:var(--diverge)}.basis.def{color:var(--muted)}.basis.double{color:var(--muted)}.basis.measure{color:var(--accent)}
tr.new td{background:var(--hl)}
tr.hidden td.v{color:var(--dim)}
ol.steps{margin:0;padding-left:20px;color:var(--muted)}
ol.steps li{padding:2px 0}
ol.steps li.cur{color:var(--ink);font-weight:600}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:8px}
.timeline{margin:4px 0 10px;font-size:11px}.timeline[hidden]{display:none}
.timeline .tlhead{color:var(--muted);margin-bottom:4px}
.tlrow{display:grid;grid-template-columns:minmax(80px,max-content) 1fr minmax(84px,max-content);gap:8px;align-items:center;margin:3px 0}
.tlname{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:16em}.tlrow.on .tlname{color:var(--ink);font-weight:600}
.tlbar{display:flex;height:20px;min-width:0}
.tlbar .seg{flex:none;min-width:0;height:100%;padding:0 3px;border:none;border-radius:0;border-right:1px solid var(--surface);background:var(--line);color:var(--ink);
 font:10px var(--mono);white-space:nowrap;overflow:hidden;text-overflow:clip;text-align:left;cursor:pointer}
.tlbar .seg:nth-child(even){background:var(--dim)}
.tlbar .seg.on{background:var(--accent);color:var(--surface)}
.tlbar .seg.neq{box-shadow:inset 0 0 0 2px var(--diverge)}
.tlbar .seg:hover,.tlbar .seg:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.tltotal{font-family:var(--mono);white-space:nowrap}.tlrow.on .tltotal{font-weight:600}
.tlaxis{position:relative;height:14px;color:var(--muted);font-family:var(--mono);font-size:10px}
.tlaxis span{position:absolute;transform:translateX(-50%)}.tlaxis span:first-child{transform:none}
.node.peek rect{stroke:var(--accent);stroke-width:2.6}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px;border:1.5px solid}
footer{padding:0 20px 16px;font-size:11px;color:var(--muted)}
.node rect{fill:var(--surface);stroke:var(--ink);stroke-width:1.2}
.node.dec rect{stroke-dasharray:4 3}
.node text{font:13px var(--mono);fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.node.off{opacity:.55}
.node.end rect{stroke-width:2.4}
.node.cur rect{stroke:var(--accent);stroke-width:2.2}
.edge{fill:none;stroke:var(--dim);stroke-width:1;stroke-dasharray:3 4}
.edge.on{stroke:var(--accent);stroke-width:2;stroke-dasharray:none}
.edge.todo{stroke:var(--accent);stroke-width:1.4;stroke-dasharray:5 4;opacity:.55}
.elabel{font:11px var(--sans);fill:var(--muted)}
.dot circle{fill:var(--accent)}.dot.m circle{fill:var(--minus)}.dot.p circle{fill:var(--plus)}
.dsign{font:700 13px var(--sans);fill:var(--surface)}
.edge.on.m,.edge.todo.m{stroke:var(--minus)}.edge.on.p,.edge.todo.p{stroke:var(--plus)}
.node.cur.m rect{stroke:var(--minus)}.node.cur.p rect{stroke:var(--plus)}
.phead.two{display:flex;gap:24px;flex-wrap:wrap}.phead.two .minus{color:var(--minus)}.phead.two .plus{color:var(--plus)}
.dsw{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;margin-right:6px;color:var(--surface);font-size:13px}
.dsw.m{background:var(--minus)}.dsw.p{background:var(--plus)}
.panes{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.panes.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.pane{min-width:0}
.phead{font-weight:600;margin:0 0 4px;display:none}
.panes.two .phead{display:block}
.phead.minus{color:var(--minus)}.phead.plus{color:var(--plus)}
.panes.two svg{max-height:calc(100vh - 250px)}
.node.diverge rect{stroke:var(--diverge);stroke-width:2.6}
.divmark{font:600 12px var(--sans);fill:var(--diverge)}
th{font:600 11px var(--sans);color:var(--muted);text-align:left;padding:4px 6px;border-bottom:1px solid var(--line)}
tr.diff td.v{font-weight:600}
.sign{color:var(--muted);margin-right:4px}
.cap2{display:block;margin-top:4px}
#tabs .pair{border-style:dashed}
#variants:empty{display:none}
#variants .lbl{align-self:center;color:var(--muted);font-size:11px;margin-right:4px}
main.matrix{grid-template-columns:minmax(0,1fr)}
main.matrix aside,main.matrix .legend{display:none}
table.mx{border-collapse:collapse;width:100%}
table.mx th,table.mx td{border:1px solid var(--line);padding:6px 8px;vertical-align:top}
table.mx td{font-family:var(--mono);cursor:pointer;position:relative;padding-right:22px;transition:background .15s,box-shadow .15s}
table.mx td:hover,table.mx td:focus-visible{outline:none;background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent),0 2px 8px -2px rgba(15,23,42,.25)}
table.mx td .chev{position:absolute;right:6px;top:50%;width:8px;height:12px;margin-top:-6px;max-height:none;fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:.55;transition:opacity .15s,transform .15s}
table.mx td:hover .chev,table.mx td:focus-visible .chev{opacity:1;transform:translateX(3px)}
table.mx td.pulse{animation:ring .7s ease-in-out .4s 2}
@keyframes ring{50%{box-shadow:inset 0 0 0 2px var(--accent)}}
.mxs{overflow-x:auto}
.hint{display:flex;width:fit-content;max-width:38em;gap:8px;align-items:center;margin:0 0 10px;color:var(--muted)} /* a caption under the verdict, never louder than it */
.hint svg{width:14px;height:14px;flex:none;fill:var(--accent)}
code{font-family:var(--mono);font-size:.95em}
#foot a{color:inherit;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:2px}
#foot a:hover{color:var(--accent);text-decoration-color:var(--accent)}
table.mx .out{display:block;font:600 13px var(--sans);color:var(--ink)}
table.mx .out+.val{display:block;margin-top:2px;font-size:12px;color:var(--muted)}
table.mx tr.split th{color:var(--ink)}
.mxkey{display:flex;flex-wrap:wrap;gap:4px 14px;font:12px var(--sans);color:var(--muted);margin:8px 0 0;max-width:60em}
.mxkey>span{white-space:nowrap}
table.mx .note{display:block;font:11px var(--sans);color:var(--muted)}
table.mx+table.mx{margin-top:20px}
table.mx .q{display:block;font:600 13px var(--sans);color:inherit;max-width:46ch}
#tabs:empty{display:none}
body.onmatrix #controls,body.onmatrix .bar{display:none}
.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:10px}
.keys{color:var(--muted);font-size:11px}.keys kbd{font:11px var(--mono);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin:0 2px}
ol.steps li.later{color:var(--dim)}
#play.go{background:var(--plus);border-color:var(--plus);color:var(--surface);font-weight:600}
.pane svg{touch-action:pan-x pan-y}
.panes.zoomed svg{cursor:grab;touch-action:none}
.panes.zoomed svg.drag{cursor:grabbing}
#variants .home{margin-right:10px}
.vnote{display:block;font:12px var(--sans);color:var(--muted);margin-top:4px;max-width:38em}
/* the matrix beside the whole graph: a cell hovered or focused lights its path there */
.panes.mxview{grid-template-columns:minmax(0,3fr) minmax(0,2fr);align-items:start}
.preview{position:sticky;top:12px;min-width:0}
.preview .phead{display:block;color:var(--muted);font-weight:500}
.pmore{display:flex;flex-wrap:wrap;gap:4px 16px;margin:4px 0 0;color:var(--muted)}.pmore b{color:var(--ink);font:600 13px var(--mono)}
/* a grid case keeps its row of the matrix: where it comes from, what else it could be compared with */
table.mx td.lit{box-shadow:inset 0 0 0 2px var(--accent)}
table.mx.mini{margin:8px 0 4px;width:auto;table-layout:fixed;font-size:13px;font-weight:400}
table.mx.mini th,table.mx.mini td{width:12em;padding-right:8px}
table.mx.mini td.side{box-shadow:inset 0 0 0 2px var(--accent)}
table.mx.mini .sgn{font-family:var(--sans);font-weight:700;float:left;margin-right:6px}
table.mx.mini td:not(.side):hover{box-shadow:none}
table.mx td:focus-visible{outline:2px dashed var(--ink);outline-offset:-6px} /* focus: dashed ink, never the solid blue of a picked side */
.pickhint{font-size:12px;color:var(--muted);margin:2px 0 0}
ol.steps button{all:unset;display:block;width:100%;cursor:pointer;border-radius:4px}
ol.steps button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* the passes of a node a loop revisits: which visit left by which branch, written beside the branch once the dot took it */
.pass rect{fill:var(--surface);stroke:var(--accent);stroke-width:1.2}.pass rect.hit{fill:transparent;stroke:none}
.pass text{font:600 10px var(--mono);fill:var(--accent);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.pass.m rect{stroke:var(--minus)}.pass.m text{fill:var(--minus)}.pass.p rect{stroke:var(--plus)}.pass.p text{fill:var(--plus)}
.pass.cur rect:not(.hit){fill:var(--accent)}.pass.cur text{fill:var(--surface)}.pass.cur.m rect:not(.hit){fill:var(--minus)}.pass.cur.p rect:not(.hit){fill:var(--plus)}
.pass{cursor:pointer;outline:none}.pass:hover rect:not(.hit),.pass:focus-visible rect:not(.hit){stroke-width:2.4}
.pass.fresh{transform-box:fill-box;transform-origin:center;animation:pop .16s cubic-bezier(.25,1,.5,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}}
ol.steps li.peek{background:var(--hl);border-radius:4px}
.sw.passw{border-radius:50%;border-color:var(--accent);color:var(--accent);font:600 8px/9px var(--mono);text-align:center}
@media (max-width:900px){main,.panes.mxview{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){table.mx td.pulse,.pass.fresh{animation:none}table.mx td,table.mx td .chev{transition:none}}
</style></head><body>

<div class="bar">

</main>
