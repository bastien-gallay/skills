<title>Free shipping threshold</title>

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.5 var(--sans)}
header{padding:16px 20px 8px}
h1{font-size:22px;margin:0 0 4px;font-weight:650;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0;max-width:38em}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:8px 20px;border-bottom:1px solid var(--line)}
.grp{display:flex;gap:4px;flex-wrap:wrap}
button,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer}
button[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.sep{width:1px;height:22px;background:var(--line)}
main{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;padding:16px 20px}
main.overview{grid-template-columns:minmax(0,1fr) 34px}
main.overview #detail{display:none}
#detail{display:flex;flex-direction:column;gap:12px}
#fold{align-self:flex-end;color:var(--muted)}
main.overview #fold{writing-mode:vertical-rl;padding:12px 6px;align-self:stretch;max-height:220px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
svg{width:100%;height:auto;display:block;max-height:calc(100vh - 210px)}
.summary{margin:0 0 8px;font-size:16px;font-weight:500;min-width:0}
.summary>:not(.casehead),.casetext{max-width:38em}
.casehead{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:flex-start;justify-content:space-between}
.caserow{display:flex;gap:10px;align-items:flex-start}.caserow .home{font-size:13px;margin-top:8px}
body.grid .bar{display:none}
.ocap{display:none;margin:8px 0 0;font-size:16px}main.overview .ocap{display:block}
.ocap .cap2{display:inline;margin-right:16px}
.origin{display:block;font:11px var(--sans);font-weight:400;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.origin.real{color:var(--accent)}
.summary .warn{color:var(--diverge);font-weight:600}
aside{display:flex;flex-direction:column;gap:12px;position:sticky;top:8px;align-self:start;max-height:calc(100vh - 16px);overflow:auto}
.caption{font-size:16px;min-height:4.4em}
.msg{font-family:var(--mono);font-size:13px;color:var(--accent);margin-top:6px}
table{width:100%;border-collapse:collapse}
td{padding:4px 6px;border-bottom:1px solid var(--line);vertical-align:top}
td:first-child{color:var(--muted);width:46%}
td.v{font-family:var(--mono)}
.basis{font:11px var(--sans);margin-left:6px;cursor:help}.basisrow td{border-bottom:none;color:var(--muted);font-size:11px;padding-top:8px}.basisrow .basis{margin:0 10px 0 0;cursor:auto}.basis.code{color:var(--plus)}.basis.port{color:var(--diverge)}.basis.def{color:var(--muted)}
tr.new td{background:var(--hl)}
tr.hidden td.v{color:var(--dim)}
ol.steps{margin:0;padding-left:20px;color:var(--muted)}
ol.steps li{padding:2px 0}
ol.steps li.cur{color:var(--ink);font-weight:600}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:8px}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px;border:1.5px solid}
footer{padding:0 20px 16px;font-size:11px;color:var(--muted)}
.node rect{fill:var(--surface);stroke:var(--ink);stroke-width:1.2}
.node.dec rect{stroke-dasharray:4 3}
.node text{font:13px var(--mono);fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.node.off{opacity:.55}
.node.end rect{stroke-width:2.4}
.node.cur rect{stroke:var(--accent);stroke-width:2.2}
.edge{fill:none;stroke:var(--dim);stroke-width:1;stroke-dasharray:3 4}
.edge.on{stroke:var(--accent);stroke-width:2;stroke-dasharray:none}
.edge.todo{stroke:var(--accent);stroke-width:1.4;stroke-dasharray:5 4;opacity:.55}
.elabel{font:11px var(--sans);fill:var(--muted)}
.dot circle{fill:var(--accent)}.dot.m circle{fill:var(--minus)}.dot.p circle{fill:var(--plus)}
.dsign{font:700 13px var(--sans);fill:var(--surface)}
.edge.on.m,.edge.todo.m{stroke:var(--minus)}.edge.on.p,.edge.todo.p{stroke:var(--plus)}
.node.cur.m rect{stroke:var(--minus)}.node.cur.p rect{stroke:var(--plus)}
.phead.two{display:flex;gap:24px;flex-wrap:wrap}.phead.two .minus{color:var(--minus)}.phead.two .plus{color:var(--plus)}
.dsw{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;margin-right:6px;color:var(--surface);font-size:13px}
.dsw.m{background:var(--minus)}.dsw.p{background:var(--plus)}
.panes{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.panes.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.pane{min-width:0}
.phead{font-weight:600;margin:0 0 4px;display:none}
.panes.two .phead{display:block}
.phead.minus{color:var(--minus)}.phead.plus{color:var(--plus)}
.panes.two svg{max-height:calc(100vh - 250px)}
.node.diverge rect{stroke:var(--diverge);stroke-width:2.6}
.divmark{font:600 12px var(--sans);fill:var(--diverge)}
th{font:600 11px var(--sans);color:var(--muted);text-align:left;padding:4px 6px;border-bottom:1px solid var(--line)}
tr.diff td.v{font-weight:600}
.sign{color:var(--muted);margin-right:4px}
.cap2{display:block;margin-top:4px}
#tabs .pair{border-style:dashed}
#variants:empty{display:none}
#variants .lbl{align-self:center;color:var(--muted);font-size:11px;margin-right:4px}
main.matrix{grid-template-columns:minmax(0,1fr)}
main.matrix aside,main.matrix .legend{display:none}
table.mx{border-collapse:collapse;width:100%}
table.mx th,table.mx td{border:1px solid var(--line);padding:6px 8px;vertical-align:top}

table.mx td:hover,table.mx td:focus-visible{outline:none;background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent),0 2px 8px -2px rgba(15,23,42,.25)}
table.mx td .chev{position:absolute;right:6px;top:50%;width:8px;height:12px;margin-top:-6px;max-height:none;fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:.55;transition:opacity .15s,transform .15s}
table.mx td:hover .chev,table.mx td:focus-visible .chev{opacity:1;transform:translateX(3px)}
table.mx td.pulse{animation:ring .7s ease-in-out .4s 2}
@keyframes ring{50%{box-shadow:inset 0 0 0 2px var(--accent)}}
.mxs{overflow-x:auto}
.hint{display:flex;width:fit-content;max-width:38em;gap:8px;align-items:center;margin:0 0 10px;color:var(--muted)} /* a caption under the verdict, never louder than it */
.hint svg{width:14px;height:14px;flex:none;fill:var(--accent)}
code{font-family:var(--mono);font-size:.95em}
#foot a{color:inherit;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:2px}
#foot a:hover{color:var(--accent);text-decoration-color:var(--accent)}
table.mx .out{display:block;font:600 13px var(--sans);color:var(--ink)}
table.mx .out+.val{display:block;margin-top:2px;font-size:12px;color:var(--muted)}
table.mx tr.split th{color:var(--ink)}
.mxkey{display:flex;flex-wrap:wrap;gap:4px 14px;font:12px var(--sans);color:var(--muted);margin:8px 0 0;max-width:60em}
.mxkey>span{white-space:nowrap}
table.mx .note{display:block;font:11px var(--sans);color:var(--muted)}
table.mx+table.mx{margin-top:20px}
table.mx .q{display:block;font:600 13px var(--sans);color:inherit;max-width:46ch}
#tabs:empty{display:none}
body.onmatrix #controls,body.onmatrix .bar{display:none}
.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:10px}
.keys{color:var(--muted);font-size:11px}.keys kbd{font:11px var(--mono);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin:0 2px}

#play.go{background:var(--plus);border-color:var(--plus);color:var(--surface);font-weight:600}
.pane svg{touch-action:pan-x pan-y}
.panes.zoomed svg{cursor:grab;touch-action:none}
.panes.zoomed svg.drag{cursor:grabbing}
#variants .home{margin-right:10px}
.vnote{display:block;font:12px var(--sans);color:var(--muted);margin-top:4px;max-width:38em}

.preview{position:sticky;top:12px;min-width:0}

table.mx.mini td.side{box-shadow:inset 0 0 0 2px var(--accent)}

 $("data").innerHTML=rs.filter(r=>!(grid&&r.answer)).map(r=>`<tr class="${r.at>st.step?"hidden":changedAt(r,st.step)?"new":""}"><td${basisTitle(r)}>${rich(r.label)}</td><td class="v">${r.at>st.step?"…":esc(valueAt(r,st.step))+provenanceTag(r,only)}</td></tr>`).join("")+basisLegend(rs,2);
 $("steps").innerHTML=s.steps.map((x,i)=>stepItem(i,()=>rich(x.message))).join("");}
/** Two scenarios side by side: what they share is said once, what differs is said − then +. */
function renderTwo(a,b){const sa=a.steps[stepOf(a,st.step)],sb=b.steps[stepOf(b,st.step)];
 $("caption").innerHTML=sa.caption===sb.caption?rich(sa.caption):`<span class="cap2"><span class="sign">−</span>${rich(sa.caption)}</span><span class="cap2"><span class="sign">+</span>${rich(sb.caption)}</span>`;
 $("msg").innerHTML=sa.message===sb.message?rich(sa.message):`− ${rich(sa.message)}<br>+ ${rich(sb.message)}`;
 const ra=rowsOf(a),rb=rowsOf(b),only=onlyKind(ra.concat(rb)),cols=grid?[shortOf(a.variant),shortOf(b.variant)]:[words.before,words.after];
 $("data").innerHTML=`<tr><th>${words.field}</th><th>− ${rich(cols[0])}</th><th>+ ${rich(cols[1])}</th></tr>`+ra.map((r,i)=>{if(grid&&r.answer)return ""; // the case's row above already says which answer plays on each side
  const hid=r.at>st.step,va=valueAt(r,st.step),vb=valueAt(rb[i],st.step),diff=!hid&&!r.compared&&va!==vb; // a compared row differs by design: it names the two sides, not a change
  return `<tr class="${hid?"hidden":diff?"new diff":changedAt(r,st.step)||changedAt(rb[i],st.step)?"new":""}"><td${basisTitle(r)}>${diff?"≠ ":""}${rich(r.label)}</td><td class="v">${hid?"…":esc(va)+provenanceTag(r,only)}</td><td class="v">${hid?"…":esc(vb)+provenanceTag(rb[i],only)}</td></tr>`;}).join("")+basisLegend(ra.concat(rb),3);
 $("steps").innerHTML=Array.from({length:Math.max(a.steps.length,b.steps.length)},(_,i)=>stepItem(i,()=>stepLine(a.steps[i],b.steps[i]))).join("");}
/** A step of the list: told once the dot has reached it, a numbered blank before, still a click away. */
function stepItem(i,said){const later=i>st.step;
 return `<li class="${i===st.step?"cur":later?"later":""}" data-i="${i}"><button type="button"${i===st.step?' aria-current="step"':""}${later?` aria-label="${esc(words.later)} ${i+1}"`:""}>${later?"…":said()}</button></li>`;}
/** One line of a pair's step list: said once when both sides say it, − then + otherwise; a side that has arrived says nothing. */
function stepLine(x,y){if(x&&y&&x.message===y.message)return rich(x.message);
 return [x&&"− "+rich(x.message),y&&"+ "+rich(y.message)].filter(Boolean).join("<br>");}
function render(){
 const tab=TABS[st.tab],detail=st.view==="detail";
 renderVariants();[...document.querySelectorAll("#tabs button")].forEach((b,i)=>b.setAttribute("aria-pressed",i===st.tab));
 document.body.classList.toggle("onmatrix",!!tab.matrix);
 if(tab.matrix){$("main").className="matrix";$("summary").innerHTML=rich(grid.summary);return;}
 const sides=sidesOf(tab),div=sides.length>1?divergence(sides[0],sides[1]):null;
 $("main").className=detail?"":"overview";
 renderSummary(tab,sides);
 diagrams.forEach(d=>paint(d,st.step,detail,div));
 if(sides.length>1)renderTwo(sides[0],sides[1]);else renderOne(sides[0]);
 $("ocap").innerHTML=detail?"":$("caption").innerHTML; // the overview folds the panel away, not the story
 const cur=$("steps").querySelector("li.cur");if(cur&&cur.scrollIntoView)cur.scrollIntoView({block:"nearest"});
 $("fold").textContent=detail?words.hide:words.show;$("fold").setAttribute("aria-expanded",detail);
 $("play").textContent=st.playing?"⏸":"⏵";$("play").setAttribute("aria-label",st.playing?words.pause:words.play);
 $("play").classList.toggle("go",!st.playing); // paused, Play is the obvious next click
}
// ---- motion: one dot per diagram, same hop index, same duration; a side that has arrived waits on its outcome
const easeInOut=f=>f<.5?4*f*f*f:1-Math.pow(-2*f+2,3)/2;
/** How long the view stays after step i's hop: long where a reader has something to see, short where the dot only passes. */
function dwellAfter(i){const sides=sidesOf(TABS[st.tab]),div=sides.length>1?divergence(sides[0],sides[1]):null;
 if(i===nSteps()-1||(div&&div.step===i+1))return DWELL_KEY;
 const key=sides.some(s=>{const x=s.steps[i];if(!x)return false;const n=page.nodes[dest(x.hop)];return n.role==="decision"||!!n.kind;});
 return key?DWELL_KEY:DWELL_PASS;}
const nSteps=()=>{const s=sidesOf(TABS[st.tab]);return s.length?Math.max(...s.map(x=>x.steps.length)):1;};
function runHop(){cancelAnimationFrame(st.raf);clearTimeout(st.timer);if(!diagrams.length)return;
 const hops=diagrams.flatMap(d=>d.sides.map((s,j)=>{const i=stepOf(s,st.step),h=s.steps[i].hop,p=pathOf(d,h);
  return {dot:d.dots[j],p,len:p.getTotalLength(),arrived:i<st.step,n:h.length-1};}));
 const legsNow=Math.max(1,...hops.filter(h=>!h.arrived).map(h=>h.n)); // a hop through a node takes the time of its edges
 const dur=REDUCED?1:HOP_MS*legsNow/st.speed;let t0=null; // reduced motion: the dots land at once, they never vanish
 const place=f=>{const qs=hops.map(h=>h.p.getPointAtLength((h.arrived?1:f)*h.len));
  // two dots on the same point sit side by side, − on the left, + on the right, so both stay readable
  const close=qs.length===2&&Math.hypot(qs[0].x-qs[1].x,qs[0].y-qs[1].y)<DOT_GAP;
  hops.forEach((h,j)=>{const dx=close?(j?1:-1)*DOT_GAP/2:0;h.dot.setAttribute("transform",`translate(${qs[j].x+dx} ${qs[j].y})`);});
  lastDots=qs.filter((q,j)=>!hops[j].arrived);follow(lastDots);};
 const tick=ts=>{if(!st.playing){place(1);return;}
  t0??=ts;const f=Math.min(1,(ts-t0)/dur);place(easeInOut(f));
  if(f<1){st.raf=requestAnimationFrame(tick);return;}
  st.timer=setTimeout(()=>{if(!st.playing)return;const last=st.step===nSteps()-1;
   if(last&&st.view==="detail"){st.playing=false;render();return;}
   st.step=last?0:st.step+1;render();runHop();},st.view==="detail"?dwellAfter(st.step)/st.speed:OVERVIEW_PAUSE);};
 st.raf=requestAnimationFrame(tick);}
/** The line a dot runs along: the edge, or for a hop through nodes its edges end to end, the dot crossing each node it passes. */
function pathOf(d,h){if(h.length===2)return d.edgeEls[h.join(">")];const key=h.join(">");
 d.via??={};return d.via[key]??=el("path",{d:legs(h).map((k,i)=>{const e=d.edgeEls[k].getAttribute("d");return i?e.replace(/^M/,"L"):e;}).join(" "),
  class:"via",fill:"none",stroke:"none"},d.svg);}
function go(i){st.step=Math.max(0,Math.min(nSteps()-1,i));render();runHop();}
/** The case's diagram fills the screen below what sits above it, whole, outcomes included: a projected page shows the fork. */
const WIN=typeof window==="undefined"?null:window; // absent when the page is played without a browser (tests)
function fitHeight(){if(!WIN)return;const below=$("controls").offsetHeight+$("legend").offsetHeight+FOOT_ROOM;
 const aside=document.querySelector("aside"),at=aside.getBoundingClientRect().top+WIN.scrollY; // the panel scrolls within the screen
 aside.style.maxHeight=Math.max(MIN_DIAGRAM_H,WIN.innerHeight-at-8)+"px";
 for(const d of diagrams){const top=d.svg.getBoundingClientRect().top+WIN.scrollY;
  d.svg.style.maxHeight=Math.max(MIN_DIAGRAM_H,WIN.innerHeight-top-below)+"px";}}
/** Step by step, labels stay readable: when the whole graph would draw them under MIN_LABEL_PX, the view zooms to that size
 *  on where the path starts, then follows the dots. Fit, and the overview, show the whole graph again. */
function readable(){if(!WIN||st.view!=="detail"||!diagrams.length)return;const d=diagrams[0],u=unitsPerPx(d.svg);
 if(!isFinite(u)||NODE_FONT/u>=MIN_LABEL_PX)return;
 view.k=Math.min(ZOOM_MAX,MIN_LABEL_PX*u/NODE_FONT);st.follow=true;st.readable=true;
 const b=geo.nodes[d.sides[0].steps[0].hop[0]];setView({x:b.x+b.w/2-viewW()/2,y:b.y-viewH()*FOLLOW_MARGIN});}
/** A case opens whole: the fork and where each side ends are in sight. The readable zoom waits for the reader to move. */
function openTab(i){st.tab=i;st.playing=false;st.step=0;buildPanes();fit();go(0);fitHeight();st.auto=true;}
/** The first Play or step after opening: now the view zooms to readable labels and follows the dots. */
function engage(){if(!st.auto)return;st.auto=false;readable();}
// ---- controls
if(!grid)TABS.forEach((t,i)=>{const b=document.createElement("button");b.setAttribute("role","tab");b.textContent=t.label;b.title=t.title;if(t.pair)b.className="pair";b.onclick=()=>openTab(i);$("tabs").appendChild(b);});
$("fold").onclick=()=>{st.view=st.view==="detail"?"overview":"detail";try{localStorage.setItem("truepath-view",st.view);}catch(e){}st.playing=!REDUCED;
 st.auto=false;fit();go(0);fitHeight();readable();};
try{const v=localStorage.getItem("truepath-view");if(v==="overview"||v==="detail")st.view=v;}catch(e){}
$("play").onclick=()=>{st.playing=!st.playing;if(st.playing)engage();if(st.playing)st.follow=true;if(st.playing&&st.view==="detail"&&st.step===nSteps()-1)st.step=0;render();runHop();};
$("fwd").onclick=()=>{st.playing=false;engage();go(st.step+1);};$("back").onclick=()=>{st.playing=false;engage();go(st.step-1);};
$("restart").onclick=()=>{st.playing=true;engage();st.follow=true;go(0);};
$("zin").onclick=()=>zoomBy(ZOOM_STEP);$("zout").onclick=()=>zoomBy(1/ZOOM_STEP);$("fit").onclick=()=>{st.auto=false;fit();};$("speed").onchange=e=>{st.speed=+e.target.value;};
$("steps").onclick=e=>{const li=e.target.closest("li");if(li){st.playing=false;engage();go(+li.dataset.i);}};
const cssq=v=>String(v).replace(/["\\]/g,"\\$&"); // a value inside a quoted attribute selector
/** Back to the matrix, the focus on the cell the case was opened from. */
function home(){openTab(0);const f=st.from;if(!f)return;
 const td=$("panes").querySelector(`td[data-case="${f.case}"][data-variant="${cssq(f.variant)}"][data-section="${f.section}"]`);td&&td.focus&&td.focus();}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&grid&&!TABS[st.tab].matrix){e.preventDefault();home();return;}
 if(e.target.tagName==="SELECT")return;
 if(e.key==="ArrowRight")$("fwd").click();else if(e.key==="ArrowLeft")$("back").click();
 else if(e.key===" "&&e.target.tagName!=="BUTTON"){e.preventDefault();$("play").click();} // on a button, Space presses that button
 else if(e.key==="+"||e.key==="=")$("zin").click();else if(e.key==="-")$("zout").click();else if(e.key==="0")$("fit").click();});
/** A cell of the case's row: on +, or on − with Shift; the side it leaves goes to the other one rather than playing twice. */
function pick(td,minus){const v=td.dataset.variant,[me,other]=minus?["minus","plus"]:["plus","minus"];if(v===st[me])return;
 if(v===st[other])st[other]=st[me];st[me]=v;openTab(st.tab);
 const again=$("summary").querySelector(`td[data-variant="${cssq(v)}"]`);again&&again.focus&&again.focus();} // the row is drawn anew: focus stays on the cell
$("summary").addEventListener("click",e=>{if(e.target.closest&&e.target.closest("[data-home]")){home();return;}
 const td=e.target.closest&&e.target.closest("td[data-case]");if(td)pick(td,e.shiftKey);});
$("summary").addEventListener("keydown",e=>{const td=e.target.closest&&e.target.closest("td[data-case]");
 if(!td||(e.key!=="Enter"&&e.key!==" "))return;e.preventDefault();e.stopPropagation();pick(td,e.shiftKey);});
if(grid)document.body.classList.add("grid");
WIN&&WIN.addEventListener("resize",()=>{fitHeight();if(st.readable)readable();}); // a readable zoom is measured again
openTab(0);
</script></body></html>
