#tabs .pair{border-style:dashed}

/** Zoomed in and following: aim the view at the moving dots, then glide there. */
function follow(dots){if(!st.follow||view.k===1||!dots.length)return;
 const xs=dots.map(q=>q.x),ys=dots.map(q=>q.y);
 const c=clampView({x:keepIn(Math.min(...xs),Math.max(...xs),aim.x,viewW()),y:keepIn(Math.min(...ys),Math.max(...ys),aim.y,viewH())});
 aim.x=c.x;aim.y=c.y;
 if(REDUCED){setView(aim);return;}
 if(!glideRaf)glideRaf=requestAnimationFrame(glide);}
function glide(){const dx=aim.x-view.x,dy=aim.y-view.y;
 if(Math.abs(dx)<.5&&Math.abs(dy)<.5){glideRaf=0;setView(aim);return;}
 view.x+=dx*FOLLOW_EASE;view.y+=dy*FOLLOW_EASE;applyView();glideRaf=requestAnimationFrame(glide);}
/** Diagram units per screen pixel; the drawing is centred in its element (preserveAspectRatio meet). */
function unitsPerPx(svg){const r=svg.getBoundingClientRect();return Math.max(viewW()/r.width,viewH()/r.height);}
function toDiagram(svg,px,py){const r=svg.getBoundingClientRect(),u=unitsPerPx(svg);
 return [view.x+(px-r.left-(r.width-viewW()/u)/2)*u,view.y+(py-r.top-(r.height-viewH()/u)/2)*u];}
/** A pan is the reader taking the view: it stops following the dot until Play or Fit. */
function panBy(svg,dx,dy){st.follow=false;const u=unitsPerPx(svg);setView({x:view.x-dx*u,y:view.y-dy*u});}
/** Ctrl/Cmd + wheel (a trackpad pinch arrives so) zooms at the pointer; the wheel and a drag pan once zoomed; two fingers pinch. */
function listenZoom(svg){const pts=new Map();let pinch=null,gesture=1;
 const spread=()=>{const [a,b]=[...pts.values()];return Math.hypot(a.x-b.x,a.y-b.y)||1;};
 const middle=()=>{const [a,b]=[...pts.values()];return [(a.x+b.x)/2,(a.y+b.y)/2];};
 svg.addEventListener("wheel",e=>{const px=e.deltaMode===1?16:1;
  if(e.ctrlKey||e.metaKey){e.preventDefault();zoomAt(Math.exp(-e.deltaY*px*.0025),...toDiagram(svg,e.clientX,e.clientY));return;}
  if(view.k===1)return; // not zoomed: the wheel scrolls the page
  e.preventDefault();panBy(svg,-e.deltaX*px,-e.deltaY*px);},{passive:false});
 svg.addEventListener("pointerdown",e=>{if(e.pointerType==="mouse"&&e.button!==0)return;
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});if(svg.setPointerCapture)svg.setPointerCapture(e.pointerId);
  if(pts.size===2)pinch={d:spread(),k:view.k};if(view.k>1||pinch)svg.classList.add("drag");});
 svg.addEventListener("pointermove",e=>{const last=pts.get(e.pointerId);if(!last)return;
  const now={x:e.clientX,y:e.clientY};pts.set(e.pointerId,now);
  if(pinch&&pts.size===2){zoomAt(pinch.k*spread()/pinch.d/view.k,...toDiagram(svg,...middle()));return;}
  if(view.k>1)panBy(svg,now.x-last.x,now.y-last.y);});
 const up=e=>{pts.delete(e.pointerId);if(pts.size<2)pinch=null;if(!pts.size)svg.classList.remove("drag");};
 svg.addEventListener("pointerup",up);svg.addEventListener("pointercancel",up);
 svg.addEventListener("gesturestart",e=>{e.preventDefault();gesture=1;}); // Safari's own pinch
 svg.addEventListener("gesturechange",e=>{e.preventDefault();zoomAt(e.scale/gesture,...toDiagram(svg,e.clientX,e.clientY));gesture=e.scale;});}

// ---- one diagram per side
function draw(pane,k,side){
 const svg=el("svg",{viewBox:`0 0 ${geo.width} ${geo.height}`,role:"img"},pane);
 const defs=el("defs",{},svg);
 for(const [id,col] of [["on","var(--accent)"],["off","var(--dim)"]]){
  const m=el("marker",{id:`a-${id}-${k}`,viewBox:"0 0 10 10",refX:8,refY:5,markerWidth:6,markerHeight:6,orient:"auto-start-reverse"},defs);
  el("path",{d:"M2 1L8 5L2 9",fill:"none",stroke:col,"stroke-width":1.6,"stroke-linecap":"round"},m);}
 const edgeEls={},nodeEls={},taken=new Set(side.steps.map(x=>x.hop.join(">")));
 const isTaken=e=>taken.has(e.from+">"+e.to);
 for(const e of [...geo.edges].sort((x,y)=>isTaken(x)-isTaken(y))){ // the path last: it is drawn over the stubs it shares with other edges
  edgeEls[e.from+">"+e.to]=el("path",{d:e.d,class:"edge"},svg);
  if(e.label&&e.labelPos){el("text",{x:e.labelPos[0],y:e.labelPos[1],class:"elabel"},svg).textContent=e.label;}}
 for(const [id,box] of Object.entries(geo.nodes)){
  const n=page.nodes[id],g=el("g",{class:"node"+(n.role==="decision"?" dec":"")},svg);
  const r=el("rect",{x:box.x,y:box.y,width:box.w,height:box.h,rx:n.role==="start"?box.h/2:8},g); // where a path starts is round
  if(n.kind){const c=page.kinds[n.kind].color;r.style.stroke=c;r.style.fill=`color-mix(in srgb, ${c} ${TINT}, var(--surface))`;}
  box.labelLines.forEach((l,i)=>{el("text",{x:box.x+box.w/2,y:box.y+box.h/2+(i-(box.labelLines.length-1)/2)*geo.lineHeight},g).textContent=l;});
  el("text",{x:box.x+box.w+6,y:box.y+12,class:"divmark",visibility:"hidden"},g).textContent="≠";
  nodeEls[id]=g;}
 listenZoom(svg);
 return {svg,edgeEls,nodeEls,k,side,dot:el("circle",{r:5,class:"dot",cx:-20,cy:-20},svg)};
}
let diagrams=[];
function buildPanes(){const tab=TABS[st.tab],box=$("panes");box.innerHTML="";diagrams=[];
 if(tab.matrix){box.className="panes";box.appendChild(matrix());return;}
 const sides=sidesOf(tab);box.className="panes"+(sides.length>1?" two":"");
 diagrams=sides.map((s,k)=>{const pane=document.createElement("div");pane.className="pane";
  const h=document.createElement("p");h.className="phead "+(k?"plus":"minus");
  h.innerHTML=(k?"+ ":"− ")+(grid?rich(headOf(s.variant)):originBullet(s.origin)+rich(s.tab));pane.appendChild(h);box.appendChild(pane);
  return draw(pane,k,s);});}
/** One section per question: its cases against today and each answer; one field per cell, the others on hover; a click opens the case. */
const POINTER=`<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 1.5l10 6.2-4.3 1 2.4 4.6-1.9 1-2.4-4.6L3 13z"/></svg>`;
const CHEVRON=`<svg class="chev" viewBox="0 0 8 12" aria-hidden="true"><path d="M2 2l4 4-4 4"/></svg>`;
/** One section per question: its cases against today and each answer; one field per cell, the others on hover.
 * A cell is a button (click, Enter, Space) that opens the case; the first changed cell rings twice to show it. */
function matrix(){const wrap=document.createElement("div"),hover=grid.hover.filter(l=>l!==grid.show);
 const val=(s,label)=>rowsOf(s).find(r=>r.label===label).shown,baseName=plain(variantOf(grid.baseline).short);let pulsed=false;
 wrap.innerHTML=`<p class="hint">${POINTER}<span>${esc(words.hint(baseName))}</span></p>`+grid.sections.map((sec,si)=>{
  const head=`<tr><th>${sec.text?`<span class="q">${rich(sec.text)}</span>`:words.caseCol}</th>${sec.columns.map(c=>
   `<th>${rich(c.head)}${c.note?`<span class="note">${rich(c.note)}</span>`:""}</th>`).join("")}</tr>`;
  const body=sec.cases.map(cid=>{const ci=grid.cases.findIndex(c=>c.id===cid),c=grid.cases[ci],base=cellOf(cid,grid.baseline);
   return `<tr><th title="${esc(plain(c.origin.text))}">${originBullet(c.origin)}${rich(c.label)}</th>${sec.columns.map(col=>{const s=cellOf(cid,col.variant),x=val(s,grid.show);
    const changed=col.variant!==grid.baseline&&x!==val(base,grid.show),tip=hover.map(l=>plain(l)+words.sep+val(s,l)).join("\n");
    const pulse=changed&&!pulsed;if(pulse)pulsed=true;
    return `<td tabindex="0" role="button" class="${pulse?"pulse":""}" aria-label="${esc(plain(c.label)+" · "+plain(col.head)+words.sep+x)}" data-case="${ci}" data-variant="${esc(col.variant)}" data-section="${si}" title="${esc(tip)}">${changed?`<span class="chg">≠ ${esc(x)}</span>`:esc(x)}${CHEVRON}</td>`;}).join("")}</tr>`;}).join("");
  return `<div class="mxs"><table class="mx">${head}${body}</table></div>`;}).join("")
  +`<p class="vnote">${words.cell}${rich(grid.show)}${hover.length?words.hover+hover.map(rich).join(", "):""}${esc(words.differs(baseName))}</p>`;
 const open=td=>{st.plus=td.dataset.variant;st.minus=grid.baseline;st.section=+td.dataset.section;openTab(+td.dataset.case+1);};
 wrap.onclick=e=>{const td=e.target.closest("td[data-case]");if(td)open(td);};
 wrap.onkeydown=e=>{const td=e.target.closest&&e.target.closest("td[data-case]");if(!td||(e.key!=="Enter"&&e.key!==" "))return;
  e.preventDefault();e.stopPropagation();open(td);}; // Space opens the cell, it does not start Play
 return wrap;}

/** A side's own step at the page's step: in a pair of unequal length, the side that has arrived stays on its outcome. */
const stepOf=(side,i)=>Math.min(i,side.steps.length-1);
function paint(d,step,detail,div){const s=d.side,keys=s.steps.map(x=>x.hop.join(">"));
 for(const [k,p] of Object.entries(d.edgeEls)){const idx=keys.indexOf(k);let c="edge";
  if(idx>=0)c+=(!detail||idx<=step)?" on":" todo";p.setAttribute("class",c);p.setAttribute("marker-end",`url(#a-${idx>=0?"on":"off"}-${d.k})`);}
 const onPath=new Set(s.steps.flatMap(x=>x.hop));
 for(const [id,g] of Object.entries(d.nodeEls)){let c=g.getAttribute("class").replace(/ (off|cur|diverge)/g,"");
  if(!onPath.has(id))c+=" off";if(detail&&id===s.steps[stepOf(s,step)].hop[1])c+=" cur";
  const diverges=div&&id===div.node&&(!detail||step>=div.step);if(diverges)c+=" diverge";
  g.querySelector(".divmark").setAttribute("visibility",diverges?"visible":"hidden");g.setAttribute("class",c);}}

/** In a grid case: back to the matrix, then which variant plays on each side, among the open section's columns. */
function renderVariants(){const box=$("variants");box.innerHTML="";const tab=TABS[st.tab];if(!grid||tab.matrix)return;
 const home=document.createElement("button");home.className="home";home.textContent=words.home;home.onclick=()=>openTab(0);box.appendChild(home);
 for(const side of ["minus","plus"]){const lbl=document.createElement("span");lbl.className="lbl";lbl.textContent=side==="minus"?"−":"+";box.appendChild(lbl);
  grid.sections[st.section].columns.forEach(col=>{const b=document.createElement("button");b.textContent=plain(col.short);b.title=plain(col.head);
   b.setAttribute("aria-pressed",col.variant===st[side]);b.onclick=()=>{st[side]=col.variant;openTab(st.tab);};box.appendChild(b);});}}
const originLine=o=>`<span class="origin ${o.kind==="real"?"real":"illustrative"}">${o.kind==="real"?words.real:words.illus} · ${rich(o.text)}</span>`;
function renderSummary(tab,sides){
 if(grid){const notes=sides.map((s,k)=>{const v=variantOf(s.variant);return v.note?`<span class="vnote">${k?"+":"−"} ${rich(headOf(v.id))}${words.sep}${rich(v.note)}</span>`:"";}).join("");
  $("summary").innerHTML=rich(tab.case.summary)+originLine(tab.case.origin)+notes;}
 else if(sides.length>1)$("summary").innerHTML=rich(tab.pair.summary);
 else $("summary").innerHTML=(sides[0].undecided?`<span class="warn">${words.undecided}</span>`:"")+rich(sides[0].summary)+originLine(sides[0].origin);}
/** One scenario: its caption, its data so far, its steps. */
function renderOne(s){const step=s.steps[st.step];$("caption").innerHTML=rich(step.caption);$("msg").innerHTML=rich(step.message);
 $("data").innerHTML=rowsOf(s).map(r=>`<tr class="${r.at>st.step?"hidden":r.at===st.step?"new":""}"><td>${rich(r.label)}</td><td class="v">${r.at>st.step?"…":esc(r.shown)+provenanceTag(r)}</td></tr>`).join("");
 $("steps").innerHTML=s.steps.map((x,i)=>`<li class="${i===st.step?"cur":""}" data-i="${i}">${rich(x.message)}</li>`).join("");}
/** Two scenarios side by side: what they share is said once, what differs is said − then +. */
function renderTwo(a,b){const sa=a.steps[stepOf(a,st.step)],sb=b.steps[stepOf(b,st.step)];
 $("caption").innerHTML=sa.caption===sb.caption?rich(sa.caption):`<span class="cap2"><span class="sign">−</span>${rich(sa.caption)}</span><span class="cap2"><span class="sign">+</span>${rich(sb.caption)}</span>`;
 $("msg").innerHTML=sa.message===sb.message?rich(sa.message):`− ${rich(sa.message)}<br>+ ${rich(sb.message)}`;
 const ra=rowsOf(a),rb=rowsOf(b),cols=grid?[shortOf(a.variant),shortOf(b.variant)]:[words.before,words.after];
 $("data").innerHTML=`<tr><th>${words.field}</th><th>− ${rich(cols[0])}</th><th>+ ${rich(cols[1])}</th></tr>`+ra.map((r,i)=>{const hid=r.at>st.step,diff=!hid&&r.shown!==rb[i].shown;
  return `<tr class="${hid?"hidden":diff?"new diff":""}"><td>${diff?"≠ ":""}${rich(r.label)}</td><td class="v">${hid?"…":esc(r.shown)+provenanceTag(r)}</td><td class="v">${hid?"…":esc(rb[i].shown)+provenanceTag(rb[i])}</td></tr>`;}).join("");
 $("steps").innerHTML=Array.from({length:Math.max(a.steps.length,b.steps.length)},(_,i)=>`<li class="${i===st.step?"cur":""}" data-i="${i}">${stepLine(a.steps[i],b.steps[i])}</li>`).join("");}
/** One line of a pair's step list: said once when both sides say it, − then + otherwise; a side that has arrived says nothing. */
function stepLine(x,y){if(x&&y&&x.message===y.message)return rich(x.message);
 return [x&&"− "+rich(x.message),y&&"+ "+rich(y.message)].filter(Boolean).join("<br>");}
function render(){
 const tab=TABS[st.tab],detail=st.view==="detail";
 renderVariants();[...document.querySelectorAll("#tabs button")].forEach((b,i)=>b.setAttribute("aria-pressed",i===st.tab));
 document.body.classList.toggle("onmatrix",!!tab.matrix);
 if(tab.matrix){$("main").className="matrix";$("summary").innerHTML=rich(grid.summary);return;}
 const sides=sidesOf(tab),div=sides.length>1?divergence(sides[0],sides[1]):null;
 $("main").className=detail?"":"overview";
 renderSummary(tab,sides);
 diagrams.forEach(d=>paint(d,st.step,detail,div));
 if(sides.length>1)renderTwo(sides[0],sides[1]);else renderOne(sides[0]);
 $("fold").textContent=detail?words.hide:words.show;$("fold").setAttribute("aria-expanded",detail);
 $("play").textContent=st.playing?"⏸":"⏵";$("play").setAttribute("aria-label",st.playing?words.pause:words.play);
 $("play").classList.toggle("go",!st.playing); // paused, Play is the obvious next click
}
// ---- motion: one dot per diagram, same hop index, constant speed; a side that has arrived waits on its outcome
const nSteps=()=>{const s=sidesOf(TABS[st.tab]);return s.length?Math.max(...s.map(x=>x.steps.length)):1;};
function runHop(){cancelAnimationFrame(st.raf);clearTimeout(st.timer);if(!diagrams.length)return;
 const hops=diagrams.map(d=>{const i=stepOf(d.side,st.step),p=d.edgeEls[d.side.steps[i].hop.join(">")];return {d,p,len:p.getTotalLength(),arrived:i<st.step};});
 const dur=Math.max(...hops.filter(h=>!h.arrived).map(h=>h.len))/PX_PER_S*1000/st.speed;let t0=null;
 const place=f=>{lastDots=hops.map(h=>{const q=h.p.getPointAtLength((h.arrived?1:f)*h.len);
   h.d.dot.setAttribute("cx",q.x);h.d.dot.setAttribute("cy",q.y);return h.arrived?null:q;}).filter(Boolean);follow(lastDots);};
 const tick=ts=>{if(!st.playing){place(1);return;}
  t0??=ts;const f=Math.min(1,(ts-t0)/dur);place(f);
  if(f<1){st.raf=requestAnimationFrame(tick);return;}
  st.timer=setTimeout(()=>{if(!st.playing)return;const last=st.step===nSteps()-1;
   if(last&&st.view==="detail"){st.playing=false;render();return;}
   st.step=last?0:st.step+1;render();runHop();},st.view==="detail"?DWELL/st.speed:OVERVIEW_PAUSE);};
 st.raf=requestAnimationFrame(tick);}
function go(i){st.step=Math.max(0,Math.min(nSteps()-1,i));render();runHop();}
function openTab(i){st.tab=i;st.playing=false;st.step=0;buildPanes();fit();go(0);}
// ---- controls
if(!grid)TABS.forEach((t,i)=>{const b=document.createElement("button");b.setAttribute("role","tab");b.textContent=t.label;b.title=t.title;if(t.pair)b.className="pair";b.onclick=()=>openTab(i);$("tabs").appendChild(b);});
$("fold").onclick=()=>{st.view=st.view==="detail"?"overview":"detail";try{localStorage.setItem("truepath-view",st.view);}catch(e){}st.playing=!REDUCED;go(0);};
try{const v=localStorage.getItem("truepath-view");if(v==="overview"||v==="detail")st.view=v;}catch(e){}
$("play").onclick=()=>{st.playing=!st.playing;if(st.playing)st.follow=true;if(st.playing&&st.view==="detail"&&st.step===nSteps()-1)st.step=0;render();runHop();};
$("fwd").onclick=()=>{st.playing=false;go(st.step+1);};$("back").onclick=()=>{st.playing=false;go(st.step-1);};
$("restart").onclick=()=>{st.playing=true;st.follow=true;go(0);};
$("zin").onclick=()=>zoomBy(ZOOM_STEP);$("zout").onclick=()=>zoomBy(1/ZOOM_STEP);$("fit").onclick=fit;$("speed").onchange=e=>{st.speed=+e.target.value;};
$("steps").onclick=e=>{const li=e.target.closest("li");if(li){st.playing=false;go(+li.dataset.i);}};
document.addEventListener("keydown",e=>{if(e.target.tagName==="SELECT")return;
 if(e.key==="ArrowRight")$("fwd").click();else if(e.key==="ArrowLeft")$("back").click();
 else if(e.key===" "&&e.target.tagName!=="BUTTON"){e.preventDefault();$("play").click();} // on a button, Space presses that button
 else if(e.key==="+"||e.key==="=")$("zin").click();else if(e.key==="-")$("zout").click();else if(e.key==="0")$("fit").click();});
openTab(0);
</script></body></html>
